[project]
authors = [{ name = "gookeryoung", email = "gooker_young@qq.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies    = []
description     = "中国象棋应用。"
license         = "MIT"
name            = "superchess"
readme          = "README.md"
requires-python = ">=3.13"
version         = "0.1.0"

[project.optional-dependencies]
dev = [
    "superchess[lint,test]",
    "prek>=0.4.5",
    "tox-uv>=1.13.1",
    "tox>=4.25.0",
]
docs = ["myst-parser>=3.0", "sphinx-rtd-theme>=2.0", "sphinx>=7.0"]
lint = ["pyrefly>=1.1.1", "ruff>=0.8.0"]
test = [
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.1",
    "pytest>=8.0.0",
]
[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/superchess"]

[tool.hatch.build.targets.wheel.force-include]
"src/superchess/py.typed" = "superchess/py.typed"

[[tool.uv.index]]
default = true
url     = "https://mirrors.aliyun.com/pypi/simple/"


[dependency-groups]
dev = ["superchess[dev,docs]"]
